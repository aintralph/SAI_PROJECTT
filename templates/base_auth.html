{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Sample Project</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="auth-bar">
  {% include "partials/mark.svg" %}
  <div>
    <div class="brand-name">Sample Project</div>
    <div class="brand-sub">Indirect materials</div>
  </div>
  <button class="theme-btn" id="themeToggle" type="button" title="Switch to dark theme" aria-label="Switch to dark theme">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
      <g class="theme-moon"><path d="M13.3 10.1A5.7 5.7 0 0 1 5.9 2.7 5.8 5.8 0 1 0 13.3 10.1Z"/></g>
      <g class="theme-sun"><circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.2M8 13.2v1.2M1.6 8h1.2M13.2 8h1.2M3.5 3.5l.9.9M11.6 11.6l.9.9M12.5 3.5l-.9.9M4.4 11.6l-.9.9"/></g>
    </svg>
  </button>
</div>
<main id="main" tabindex="-1" class="auth-wrap">
  {% block content %}{% endblock %}
</main>
<script defer src="{% static 'js/app.js' %}"></script>
</body>
</html>
