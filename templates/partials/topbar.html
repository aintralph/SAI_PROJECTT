<header class="topbar">
  <div class="crumb">
    <span>{{ crumb_parent|default:"Workspace" }}</span>
    <span>/</span>
    <b>{{ crumb_current|default:"Dashboard" }}</b>
  </div>
  <div class="topbar-right">
    <span class="role-pill"><i></i>{{ role.label }}</span>
    <button class="theme-btn" id="themeToggle" type="button" title="Switch theme" aria-label="Switch light or dark theme">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <circle cx="8" cy="8" r="3"/><path d="M8 1.6v1.2M8 13.2v1.2M1.6 8h1.2M13.2 8h1.2M3.5 3.5l.9.9M11.6 11.6l.9.9M12.5 3.5l-.9.9M4.4 11.6l-.9.9"/>
      </svg>
    </button>
  </div>
</header>
